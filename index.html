kname that’s based on their appearance. Use their other flaws."}, {"id": "r1sh", "text": "Light a candle if you want to mess with ghosts."}, {"id": "r1si", "text": "Always carry a magnifying glass to deter criminals."}, {"id": "r1sj", "text": "Invest in yourself. But mostly invest elsewhere."}, {"id": "r1sk", "text": "Telling people what to do is sometimes harder than doing it yourself."}, {"id": "r1sl", "text": "You know what’s cool? I don’t."}, {"id": "r1sm", "text": "Stop lying to yourself about your finances and lie in a bed of fake money within 3 days, depending on shipping."}, {"id": "r1sn", "text": "It’s very hard to be yourself. Take a break."}, {"id": "r1so", "text": "Believe their eyes, not their thighs."}, {"id": "r1sq", "text": "If you have an S in your name, sign it using the cool S, so hiring managers will know you went to school."}, {"id": "r1sr", "text": "Be an onion. Everyone cries when an onion dies."}, {"id": "r1ss", "text": "If you don't have time to learn a language, learn an accent."}, {"id": "r1su", "text": "Never moon a werewolf."}, {"id": "r1sv", "text": "Gift everything you own to your partner, one thing at a time. Before you know it, you’ll be living together."}, {"id": "r1sw", "text": "Don’t think you’ve missed your calling without checking your missed calls."}, {"id": "r1sx", "text": "Guys named Nick don’t need nicknames."}, {"id": "r1sy", "text": "Always save your receipts so you can throw them away later."}, {"id": "r1sz", "text": "Easy hardly does it."}, {"id": "r1t0", "text": "Bad porn is hard to come by."}, {"id": "r1t1", "text": "You're an adult. Never use a bong without a coaster."}, {"id": "r1t2", "text": "A pessimist’s bed is half-empty."}, {"id": "r1t3", "text": "Real tattoos are cool temporarily, but temporary tattoos are cool forever."}, {"id": "r1t4", "text": "Camouflage only fails once."}, {"id": "r1t5", "text": "Embrace your mistakes. Without typos, we wouldn't have Sharkspeare."}, {"id": "r1t6", "text": "Never back anyone
